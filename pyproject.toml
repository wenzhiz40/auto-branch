[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-branch"
version = "0.1.1"
description = "Confirmation-first conversation branch manager for Codex CLI and Claude Code"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
auto-branch = "auto_branch.cli:main"

[tool.setuptools.packages.find]
include = ["auto_branch*"]
